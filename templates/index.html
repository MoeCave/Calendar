<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Minimalist Calendar</title>

        <!-- Google Fonts (Playfair Display) -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

        <!-- CSS Propio (Tailwind v4 compilado + Custom CSS) -->
        <link rel="stylesheet" href="{{ url_for('static', filename='styles/styles.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles/custom.css') }}">
    </head>

    <body class="bg-gray-50 min-h-screen text-gray-900">
        <div class="flex flex-col lg:flex-row min-h-screen lg:h-screen lg:overflow-hidden">

            <!-- Panel Izquierdo-->
            <div class="w-full lg:w-1/2 bg-white border-b lg:border-b-0 lg:border-r border-gray-200 flex flex-col justify-between p-6 sm:p-8 lg:p-10 lg:overflow-y-auto">

                <!-- Número gigante del día -->
                <div class="text-center mb-6">
                    <div id="selected-day-number" class="text-[7rem] sm:text-[9rem] lg:text-[11rem] xl:text-[13rem] font-bold text-black leading-none mb-3"
                        style="font-family: 'Playfair Display', 'Times New Roman', serif;">
                        13
                    </div>
                    <div class="space-y-1">
                        <div id="selected-day-name" class="text-sm font-semibold uppercase tracking-wider text-gray-900">
                            FRIDAY
                        </div>
                        <div id="selected-full-date" class="text-sm text-gray-600">
                            13 February 2026
                        </div>
                    </div>
                </div>

                <!-- Sección de tareas del día seleccionado -->
                <div id="form-events" class="flex-1 flex flex-col justify-center">
                    <div class="w-full max-w-md mx-auto">
                        <h3 class="text-sm font-semibold uppercase tracking-wider text-gray-900 mb-4">
                            Events of the day
                        </h3>

                        <!-- Formulario para agregar tarea -->
                        <form id="task-form" method="post" action="/record" class="space-y-3 mb-2">
                            <input type="text" id="task-title" placeholder="New event..."
                                class="w-full bg-transparent border-b border-gray-300 px-0 py-2 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:border-gray-900 transition-colors"
                                maxlength="100">
                            <textarea id="task-description" placeholder="Description (optional)"
                            class="w-full bg-transparent border-b border-gray-300 px-0 py-1 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:border-gray-900 transition-colors resize-none h-10"
                            maxlength="300"></textarea>
                            <div class="flex gap-3 items-center pt-1">
                                <div class="flex items-center gap-2">
                                    <input type="number" id="task-duration" min="1" max="90" value="1"
                                        class="w-16 bg-transparent border-b border-gray-300 px-0 py-2 text-sm text-gray-900 focus:outline-none focus:border-gray-900 transition-colors">
                                    <span class="text-xs text-gray-500">days</span>
                                </div>

                                <!-- Selector de color minimalista -->
                                <div class="flex gap-2 ml-auto">
                                <!-- Oscuro neutro -->
                                <div class="color-option w-6 h-6 rounded-full bg-gray-900 cursor-pointer hover:ring-2 hover:ring-gray-400 transition-all btn-color"
                                    data-color="#111827"></div>

                                <!-- Azul intenso -->
                                <div class="color-option w-6 h-6 rounded-full bg-blue-500 cursor-pointer hover:ring-2 hover:ring-gray-400 transition-all btn-color"
                                    data-color="#3b82f6"></div>

                                <!-- Verde -->
                                <div class="color-option w-6 h-6 rounded-full bg-green-500 cursor-pointer hover:ring-2 hover:ring-gray-400 transition-all btn-color"
                                    data-color="#22c55e"></div>

                                <!-- Rojo -->
                                <div class="color-option w-6 h-6 rounded-full bg-red-400 cursor-pointer hover:ring-2 hover:ring-gray-400 transition-all btn-color"
                                    data-color="#f87171"></div>
                                </div>
                                <input type="hidden" id="task-color" value="#111827">
                            </div>
                            <button type="button" id="add-task-btn"
                                class="w-full bg-gray-900 text-white py-2.5 text-xs font-semibold uppercase tracking-widest rounded-lg 
                                    hover:bg-gray-800 active:bg-black transition-colors duration-150 cursor-pointer">
                                Add
                            </button>
                        </form>

                        
                    </div>
                </div>

            </div>

            <!-- Panel Derecho: Calendario FullCalendar -->
            <div id="calendar-wrap" class="w-full lg:w-1/2 bg-white p-6 sm:p-8 flex flex-col lg:h-screen lg:overflow-hidden">

                <!-- Encabezado del Calendario -->
                <div class="flex justify-between items-center mb-4 pb-4 border-b border-gray-200 shrink-0">
                    <div class="flex gap-2">
                        <button type="button" id="prev-month"
                            class="w-8 h-8 flex items-center justify-center text-gray-600 hover:bg-gray-100 rounded transition-colors cursor-pointer">
                            ←
                        </button>
                        <button type="button" id="today-btn"
                            class="px-3 h-8 flex items-center justify-center text-xs font-semibold uppercase tracking-wider text-gray-600 hover:bg-gray-100 rounded transition-colors cursor-pointer">
                            Today
                        </button>
                        <button type="button" id="next-month"
                            class="w-8 h-8 flex items-center justify-center text-gray-600 hover:bg-gray-100 rounded transition-colors cursor-pointer">
                            →
                        </button>
                    </div>
                    <h2 id="calendar-month"
                        class="text-xs font-semibold uppercase tracking-wider text-gray-900 cursor-pointer select-none">
                    FEBRUARY 2026
                    </h2>
                </div>

                <div class="wrap-calendarList flex-1 min-h-0">
                    <!-- Contenedor del Calendario FullCalendar -->
                    <div id="calendar"></div>

                    <!-- Lista de tareas del día seleccionado -->
                    <div id="tasks-list" class="space-y-3">
                        <!-- Las tareas se renderizan aquí dinámicamente -->
                    </div>
                </div>

            </div>
    </div>

        <!-- Inyectar tareas desde MongoDB -->
        <script>
            window.INIT_TASKS = {{ tasks|tojson|safe }};
        </script>
        <!-- FullCalendar JS (local) -->
        <script src="{{ url_for('static', filename='scripts/fullcalendar.global.min.js') }}"></script>

        <!-- Tu JS -->
        <script src="{{ url_for('static', filename='scripts/calendar.js') }}"></script>

    </body>
</html>
